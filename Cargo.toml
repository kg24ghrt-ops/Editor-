[package]
name = "mega_editor_android"
version = "0.1.0"
edition = "2021"
resolver = "2"  # <-- Add this to avoid dependency resolution issues

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core text data structure
ropey = "1.6"

# Undo/redo (command pattern)
undo = "0.52"

# Syntax highlighting — use the 2.x series (NOT 0.4)
synoptic = "2"

# GPU rendering
wgpu = "30"

# Android surface → wgpu::Surface adapter
# DISABLE default features to avoid pulling in `winit` on Android
app-surface = { version = "1.13", default-features = false }

# Android NDK bindings
ndk = "0.9"       # <-- Updated to latest
ndk-sys = "0.6"   # <-- Updated to latest

# JNI bindings
jni = "0.22"

# Async helpers for wgpu init
pollster = "0.3"

# Error handling
thiserror = "1.0"

# Logging on Android
log = "0.4"
android_logger = "0.13"

# Raw window handle trait (required by wgpu + app-surface)
raw-window-handle = "0.6"
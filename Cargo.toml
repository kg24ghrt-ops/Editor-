[package]
name = "mega_editor_android"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core text data structure
ropey = "1.6"

# Undo/redo (command pattern)
undo = "0.52"

# Syntax highlighting — switched to syntect for stability
syntect = { version = "5.2", default-features = false, features = ["default-themes", "parsing", "assets"] }

# GPU rendering
wgpu = { version = "30", features = ["vulkan"] }

# Android surface → wgpu::Surface adapter
# DISABLE default features to avoid pulling winit on Android
app-surface = { version = "1.13", default-features = false }

# Android NDK bindings
ndk = "0.9"
ndk-sys = "0.6"

# JNI bindings — use 0.22 with the new Env/EnvUnowned API
jni = "0.22"

# Async helpers for wgpu init
pollster = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging on Android
log = "0.4"
android_logger = "0.13"

# Raw window handle trait
raw-window-handle = "0.6"
[workspace]
members = [
    "crates/editor-core",
    "crates/editor-history",
    "crates/editor-highlight",
    "crates/editor-search",
    "crates/editor-fold",
    "crates/editor-ffi",
]
resolver = "2"

[workspace.dependencies]
ropey = "1.5.0"
tree-sitter = "0.20.10"
tree-sitter-highlight = "0.20.1"
regex = "1.10.0"
crossbeam-channel = "0.5.0"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT OR Apache-2.0"
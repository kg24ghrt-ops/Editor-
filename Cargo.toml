[package]
name = "mega_editor_android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core data structure
ropey = "1.6"

# Undo/redo (replaces add-e)
undo = "0.52"

# Syntax highlighting (lightweight)
synoptic = "0.4"

# GPU and Android surface handling
wgpu = { version = "0.20", features = ["vulkan"] }
raw-window-handle = "0.6"
app-surface = "1.13"
ndk = "0.8"
ndk-sys = "0.5"

# JNI bindings
jni = { version = "0.21", default-features = false }

# Async helpers for wgpu init
pollster = "0.3"

# Error handling
thiserror = "1.0"

# Logging on Android
log = "0.4"
android_logger = "0.13"
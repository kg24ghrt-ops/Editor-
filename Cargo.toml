[package]
name = "mega_editor_android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # produces .so for Android

[dependencies]
# Core text
ropey = "1.6"

# Syntax highlighting (lightweight, regex-based)
synoptic = "0.4"

# Undo/redo
add-e = "0.4"

# GPU rendering
wgpu = { version = "0.20", features = ["vulkan"] }
raw-window-handle = "0.6"

# Android NDK bindings
ndk = "0.8"
ndk-sys = "0.5"
jni = { version = "0.21", default-features = false }

# Surface abstraction (critical for Android)
app-surface = "1.13"  # from jinleili/wgpu-in-app[reference:3]

# Utilities
pollster = "0.3"      # block_on for async wgpu init
thiserror = "1.0"
log = "0.4"
android_logger = "0.13"
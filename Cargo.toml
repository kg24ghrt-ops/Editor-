[package]
name = "mega_editor_android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core text data structure
ropey = "1.6"

# Undo/redo (command pattern) — latest stable
undo = "0.52"                                                          # [reference:2]

# Syntax highlighting — use the 2.x series (NOT 0.4)
synoptic = "2"                                                         # [reference:3]

# GPU rendering
wgpu = "30"                                                            # [reference:4]

# Android surface → wgpu::Surface adapter
app-surface = "1.13"                                                   # [reference:5]

# Android NDK bindings
ndk = "0.8"
ndk-sys = "0.5"

# JNI bindings — latest stable
jni = "0.22"                                                           # [reference:6]

# Async helpers for wgpu init
pollster = "0.3"

# Error handling
thiserror = "1.0"

# Logging on Android
log = "0.4"
android_logger = "0.13"

# Raw window handle trait (required by wgpu + app-surface)
raw-window-handle = "0.6"